# Builds the API reference from docstrings plus the test and coverage reports
# (reports/), and publishes both to GitHub Pages. Separate from ci.yml's own
# jobs since this deploys something (a live site), not just checks a diff. A
# repo has one Pages deployment, so both ship from this workflow. The tests
# run first: a red run fails the build job and nothing is deployed.
name: docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.15"
      - run: uv sync --locked --all-groups
      - name: pytest
        run: >-
          uv run pytest --cov=forge_dashboard --cov-report=xml
          --cov-report=html --junitxml=junit.xml -o junit_family=legacy
      - run: uv run mkdocs build --strict
      # After mkdocs, whose build cleans site/ and would wipe reports/.
      - name: Build test and coverage reports
        run: uv run python hack/reports.py site/reports
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
